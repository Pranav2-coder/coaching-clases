<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery — [Institute Name]</title>
  <meta name="description" content="Explore our classrooms, campus, events and learning environment through photographs.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <section class="section" id="gallery-page" aria-label="Photo gallery">
    <div class="container">
      <div class="section__header section__header--center">
        <span class="section__eyebrow">Gallery</span>
        <h1 class="section__title">Our Campus & Learning Environment</h1>
        <p class="section__subtitle">A glimpse into our classrooms, campus, events and the atmosphere students experience daily.</p>
      </div>

      <div class="gallery-filters" id="gallery-filters"></div>
      <div class="gallery__grid" id="gallery-grid"></div>
    </div>
  </section>

  <section class="cta-section" id="cta-section" aria-label="Call to action"></section>

  <footer class="site-footer" id="site-footer"></footer>

  <div class="sticky-mobile-cta" id="sticky-mobile-cta" role="complementary" aria-label="Quick actions"></div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" role="dialog" aria-label="Image viewer" aria-modal="true">
    <button class="lightbox__close" aria-label="Close image viewer">&times;</button>
    <button class="lightbox__nav lightbox__nav--prev" aria-label="Previous image">&lsaquo;</button>
    <img class="lightbox__img" src="" alt="">
    <button class="lightbox__nav lightbox__nav--next" aria-label="Next image">&rsaquo;</button>
  </div>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const d = SITE_DATA.gallery;

      // Update page title
      document.title = `Gallery — ${SITE_DATA.institute.name}`;

      // Render filters
      const filtersEl = document.getElementById('gallery-filters');
      filtersEl.innerHTML = d.categories.map((cat, i) =>
        `<button class="gallery-filter-btn${i === 0 ? ' is-active' : ''}" data-category="${cat}">${cat}</button>`
      ).join('');

      // Render grid
      const gridEl = document.getElementById('gallery-grid');
      gridEl.innerHTML = d.images.map(img =>
        `<div class="gallery__item" data-category="${img.category}">
          <img src="${img.src}" alt="${img.alt}" width="560" height="350" loading="lazy">
        </div>`
      ).join('');

      // Init filters and lightbox
      initGalleryFilters();
      initGalleryLightbox();
    });
  </script>
</body>
</html>
