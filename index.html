<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO -->
  <title>[Institute Name] — Trusted Coaching for Academic & Competitive Excellence</title>
  <meta name="description" content="[Institute Name] offers structured coaching for Class 8–12 board preparation and competitive examinations (JEE, NEET). Experienced faculty, personal attention, and result-oriented teaching in [City].">
  <link rel="canonical" href="https://[yourdomain.com]/">

  <!-- Open Graph -->
  <meta property="og:title" content="[Institute Name] — Coaching Classes in [City]">
  <meta property="og:description" content="Quality coaching for board exams and competitive preparation. Experienced faculty, structured curriculum, and personal mentorship.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://[yourdomain.com]/">
  <meta property="og:image" content="https://[yourdomain.com]/assets/images/hero-classroom.jpg">
  <meta property="og:locale" content="en_IN">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Structured Data: Local Business -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "EducationalOrganization",
    "name": "[Institute Name]",
    "description": "Trusted coaching institute offering preparation for school board examinations and competitive exams (JEE, NEET).",
    "url": "https://[yourdomain.com]",
    "telephone": "[Phone Number]",
    "email": "[email@example.com]",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "[Street Address]",
      "addressLocality": "[City]",
      "addressRegion": "[State]",
      "postalCode": "[PIN Code]",
      "addressCountry": "IN"
    },
    "openingHours": "Mo-Fr 09:00-19:00, Sa 09:00-17:00"
  }
  </script>

  <!-- Structured Data: FAQ -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "What classes and examinations do you offer coaching for?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "We offer coaching for Class 8 through 12 (CBSE / ICSE / State Board) as well as competitive exam preparation for JEE and NEET."
        }
      },
      {
        "@type": "Question",
        "name": "What is the batch size?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "We maintain limited batch sizes to ensure personal attention and effective teaching. Specific batch strength is shared during the admission discussion."
        }
      },
      {
        "@type": "Question",
        "name": "Do you provide study material?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes, comprehensive study material including notes, worksheets and practice papers is provided as part of the course."
        }
      },
      {
        "@type": "Question",
        "name": "Is there a trial class available?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes, we encourage prospective students to attend a trial class before enrolling. Please contact our team to schedule one."
        }
      }
    ]
  }
  </script>
</head>

<body>
  <!-- ── Header ── -->
  <header class="site-header" id="site-header"></header>

  <!-- ── Hero ── -->
  <section class="hero" id="hero" aria-label="Introduction"></section>

  <!-- ── Trust Strip ── -->
  <div class="trust-strip" id="trust-strip" role="complementary" aria-label="Key strengths"></div>

  <!-- ── About ── -->
  <section class="section" id="about" aria-label="About the institute"></section>

  <!-- ── Why Choose Us ── -->
  <section class="section section--alt" id="why-us" aria-label="Why choose us"></section>

  <!-- ── Courses ── -->
  <section class="section" id="courses" aria-label="Courses offered"></section>

  <!-- ── Faculty ── -->
  <section class="section section--alt" id="faculty" aria-label="Our faculty"></section>

  <!-- ── Results ── -->
  <section class="section" id="results" aria-label="Student results"></section>

  <!-- ── Testimonials ── -->
  <section class="section section--alt" id="testimonials" aria-label="Testimonials"></section>

  <!-- ── Facilities ── -->
  <section class="section" id="facilities" aria-label="Learning facilities"></section>

  <!-- ── FAQ ── -->
  <section class="section section--alt" id="faq" aria-label="Frequently asked questions"></section>

  <!-- ── CTA ── -->
  <section class="cta-section" id="cta-section" aria-label="Call to action"></section>

  <!-- ── Enquiry Form ── -->
  <section class="section" id="enquiry" aria-label="Enquiry form"></section>

  <!-- ── Contact ── -->
  <section class="section section--alt" id="contact" aria-label="Contact information"></section>

  <!-- ── Footer ── -->
  <footer class="site-footer" id="site-footer"></footer>

  <!-- ── Sticky Mobile CTA ── -->
  <div class="sticky-mobile-cta" id="sticky-mobile-cta" role="complementary" aria-label="Quick actions"></div>

  <!-- ── Lightbox ── -->
  <div class="lightbox" id="lightbox" role="dialog" aria-label="Image viewer" aria-modal="true">
    <button class="lightbox__close" aria-label="Close image viewer">&times;</button>
    <button class="lightbox__nav lightbox__nav--prev" aria-label="Previous image">&lsaquo;</button>
    <img class="lightbox__img" src="" alt="">
    <button class="lightbox__nav lightbox__nav--next" aria-label="Next image">&rsaquo;</button>
  </div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
